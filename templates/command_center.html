<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Orchestra</title>
<style>
:root{--bg:#f5f6f8;--side:#fbfbfd;--card:#fff;--fg:#14151a;--fg2:#3a3d47;--mut:#6c707c;--line:#e6e8ec;--soft:#f1f2f5;--soft2:#e9ebf0;
--acc:#5046e5;--acc2:#7c74ff;--acc-fg:#fff;--ok:#14965a;--warn:#c2700a;--bad:#d42d2d;--info:#2563eb;
--sh:0 1px 2px rgba(16,24,40,.04),0 2px 6px rgba(16,24,40,.05);--sh2:0 24px 64px rgba(16,24,40,.18);--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0c0d10;--side:#111217;--card:#16171d;--fg:#ecedf1;--fg2:#c9cbd3;--mut:#9599a6;--line:#252731;--soft:#1c1e25;--soft2:#24262f;
--acc:#8d86ff;--acc2:#a8a2ff;--acc-fg:#0c0d10;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--info:#60a5fa;--sh:0 1px 2px rgba(0,0,0,.35);--sh2:0 24px 64px rgba(0,0,0,.6)}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
button{font:inherit;color:inherit}
aside.side{background:var(--side);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:680;font-size:15px;letter-spacing:-.01em;padding:0 4px}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#06b6d4);display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--acc) 35%,transparent)}
.logo svg{width:17px;height:17px}
.lbl{font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 6px 6px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:8px 10px;color:var(--fg2);font-weight:520;cursor:pointer;transition:background .12s}
nav button:hover{background:var(--soft)}nav button[aria-selected=true]{background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc);font-weight:620}
nav svg{width:18px;height:18px;flex:none;opacity:.85}nav .cnt{margin-left:auto;font-size:11px;font-weight:650;background:var(--bad);color:#fff;border-radius:999px;padding:0 7px}
.sidefoot{margin-top:auto}
.status-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.status-card .row{justify-content:space-between}
.content{min-width:0}
.topbar{display:flex;align-items:center;gap:16px;padding:20px 32px 6px;max-width:1320px;margin:0 auto;flex-wrap:wrap}
.topbar h1{font-size:23px;font-weight:700;letter-spacing:-.025em;margin:0;flex:1;min-width:160px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;display:flex;align-items:baseline;gap:7px;box-shadow:var(--sh);font-size:12.5px;color:var(--mut)}
.stat b{font-size:17px;color:var(--fg);font-weight:680}.stat b.warn{color:var(--warn)}.stat b.run{color:var(--info)}
main{max-width:1320px;margin:0 auto;padding:14px 32px 48px}
h2{font-size:15px;font-weight:650;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:11px;margin:20px 0 8px;color:var(--mut);font-weight:650;text-transform:uppercase;letter-spacing:.07em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;min-width:0;box-shadow:var(--sh)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.grow{flex:1}.mut{color:var(--mut);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:14px;margin-bottom:16px}.grid .card{margin:0}
.kpi .mut{font-weight:550}.kpi .big{font-size:28px;font-weight:700;letter-spacing:-.03em;margin:4px 0 2px}
select,textarea,input{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font:inherit;max-width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
select:focus,textarea:focus,input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
aside.side select{width:100%;font-weight:600}
textarea{width:100%;resize:vertical;line-height:1.5}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px;padding:0;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 13px;font-weight:580;cursor:pointer;transition:background .12s,transform .05s,filter .12s;white-space:nowrap}
.btn:hover{background:var(--soft)}.btn:active{transform:translateY(1px)}.btn svg{width:15px;height:15px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--fg2);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.dot{background:color-mix(in srgb,currentColor 12%,transparent)}.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.c-run{color:var(--info)}.c-run::before{animation:pulse 1.3s infinite}.c-bad{color:var(--bad)}.c-warn{color:var(--warn)}.c-ok{color:var(--ok)}.c-mut{color:var(--mut)}
@keyframes pulse{50%{opacity:.2}}
.err{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:11.5px;background:var(--soft)}tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:11px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:12.3px/1.6 ui-monospace,"SF Mono",Menlo,monospace;max-height:460px;overflow:auto;margin:0}
code{font:12.3px ui-monospace,"SF Mono",Menlo,monospace;background:var(--soft2);padding:1px 5px;border-radius:5px}
.empty{text-align:center;color:var(--mut);padding:28px 10px;font-size:13px}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:6px 0;margin:12px 0}
.steps span{font-size:11px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--soft2);color:var(--mut);position:relative;letter-spacing:.01em}
.steps span+span{margin-left:16px}.steps span+span::before{content:"";position:absolute;left:-15px;top:50%;width:14px;height:2px;background:var(--line)}
.steps span.done{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}.steps span.done+span::before{background:var(--ok)}
.steps span.cur{background:var(--acc);color:var(--acc-fg);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.bar{height:5px;border-radius:9px;background:var(--soft2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px}
.chat{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.convs{padding:10px;position:sticky;top:12px;max-height:calc(100vh - 110px);overflow:auto}
.conv{display:block;width:100%;text-align:left;border:0;background:none;border-radius:11px;padding:10px 11px;cursor:pointer;margin-bottom:2px}
.conv:hover{background:var(--soft)}.conv.sel{background:color-mix(in srgb,var(--acc) 11%,transparent)}
.conv .t{font-weight:600;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:3px 0}
.thread{display:flex;flex-direction:column;gap:14px;padding:22px}
.msg{display:flex;gap:11px;max-width:820px}.msg.me{align-self:flex-end;flex-direction:row-reverse}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:#64748b}
.av.lead{background:linear-gradient(135deg,var(--acc),#06b6d4)}.av.sys{background:var(--soft2);color:var(--mut)}.av.me{background:#0f766e;font-size:10.5px}
.av.analyst{background:#a855f7}.av.designer{background:#ec4899}.av.developer{background:#2563eb}.av.tester{background:#059669}.av.verifier{background:#d97706}
.bub{background:var(--soft);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:11px 14px;min-width:0}
.me .bub{background:var(--acc);color:var(--acc-fg);border-color:transparent;border-radius:16px 4px 16px 16px}
.bub.q{background:color-mix(in srgb,var(--warn) 10%,var(--card));border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.bub .who{font-size:11.5px;font-weight:650;color:var(--mut);margin-bottom:3px}.me .bub .who{color:color-mix(in srgb,var(--acc-fg) 75%,transparent)}
.composer{border-top:1px solid var(--line);padding:16px 22px;display:flex;flex-direction:column;gap:10px}
.composer textarea{min-height:92px;font-size:14.5px;border-radius:12px;padding:12px 14px}
.hero{padding:34px 26px 10px;text-align:center}.hero h2{font-size:21px;margin-bottom:6px}.hero .mut{max-width:560px;margin:0 auto}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.sugg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--fg2)}.sugg button:hover{border-color:var(--acc);color:var(--acc)}
.md h4{font-size:13.5px;margin:12px 0 4px}.md h4:first-child{margin-top:0}.md p{margin:4px 0}.md ul{margin:4px 0;padding-left:20px}.md li{margin:2px 0}.md li.ck{list-style:none;margin-left:-18px}.md pre{margin:6px 0}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--soft);border-radius:14px;padding:10px;min-height:120px}
.col h4{margin:2px 4px 10px;font-size:12.5px;display:flex;align-items:center;gap:7px}.col h4 .n{margin-left:auto}
.tcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--sh);transition:transform .1s,border-color .1s}
.tcard:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line));transform:translateY(-1px)}
.tcard .t{font-weight:600;font-size:13px;margin:4px 0 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tcard .m{font-size:12px;color:var(--mut);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.id{font-size:11.5px;font-weight:650;color:var(--mut);font-variant-numeric:tabular-nums}
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.35);backdrop-filter:blur(2px);z-index:20;display:none}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(760px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--sh2);z-index:21;transform:translateX(102%);transition:transform .22s ease;overflow:auto;visibility:hidden}
.drawer.open{transform:none;visibility:visible}.scrim.open{display:block}
.dhead{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:16px 22px 0;border-bottom:1px solid var(--line);z-index:2}
.dhead h2{margin:8px 0 0;font-size:17px}.dbody{padding:16px 22px 40px}
.tabs{display:flex;gap:4px;margin-top:6px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 11px;cursor:pointer;color:var(--mut);font-weight:580;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--acc)}
.tl{position:relative;padding-left:20px}.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .it{position:relative;padding:5px 0 10px}.tl .it::before{content:"";position:absolute;left:-18px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid currentColor}
.tl .it>*{color:var(--fg)}.tl .it>.mut{color:var(--mut)}
.agent{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start}
.agent .av{width:42px;height:42px;font-size:14px}
.gate{border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));background:color-mix(in srgb,var(--warn) 7%,var(--card));border-radius:12px;padding:12px 14px;margin-bottom:10px}
details{border-top:1px solid var(--line);padding:10px 0 2px}details summary{cursor:pointer;font-weight:580;list-style:none;display:flex;align-items:center;gap:8px;margin-bottom:8px}
details summary::-webkit-details-marker{display:none}details summary::before{content:"›";color:var(--mut);transition:transform .15s;display:inline-block}details[open] summary::before{transform:rotate(90deg)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:min(460px,calc(100% - 40px));background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;display:none;box-shadow:var(--sh2);font-weight:550;z-index:40}
@media (max-width:980px){.chat{grid-template-columns:1fr}.convs{position:static;max-height:260px}.board{grid-template-columns:repeat(4,minmax(240px,1fr))}}
@media (max-width:820px){body{grid-template-columns:1fr}aside.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px;gap:10px}
nav{flex-direction:row;overflow-x:auto}nav button{width:auto;white-space:nowrap}.sidefoot{margin:0}.lbl{display:none}
.topbar{padding:14px 16px 0}main{padding:12px 16px 32px}.thread,.composer{padding:14px}}
</style>
</head>
<body>
<aside class="side">
  <div class="brand"><span class="logo" id="logo"></span>AI Orchestra</div>
  <div><div class="lbl">Proje</div><select id="proj" aria-label="Proje"></select></div>
  <div><div class="lbl">Çalışma alanı</div><nav id="tabs"></nav></div>
  <div class="sidefoot"><div class="status-card" id="sys"></div></div>
</aside>
<div class="content">
  <div class="topbar"><h1 id="ttl"></h1><div class="stats" id="stats"></div></div>
  <main id="view"></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Görev ayrıntısı"></aside>
<div id="toast" role="status"></div>
<script>
const TOKEN='__TOKEN__';
const TABS=[['lead','Lead ile çalış'],['tasks','Görev panosu'],['agents','Ajanlar'],['activity','Etkinlik'],['tokens','Token'],['skills','Skills'],['projects','Projeler'],['settings','Ayarlar']];
const ICONS={lead:'M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z',tasks:'M4 4h6v16H4zM14 4h6v10h-6z',agents:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',
  activity:'M3 12h4l3-8 4 16 3-8h4',tokens:'M4 20V10M10 20V4M16 20v-7M22 20H2',skills:'M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z',
  projects:'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',settings:'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4',
  send:'M4 12l16-8-6 16-2.5-6.5z',x:'M6 6l12 12M18 6 6 18',plus:'M12 5v14M5 12h14',play:'M7 5l12 7-12 7z',stop:'M6 6h12v12H6z',
  logo:'M12 7.2v4.3M10.6 12.6 6.6 16M13.4 12.6l4 3.4M12 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM5 16a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM19 16a2 2 0 1 0 0 4 2 2 0 0 0 0-4z'};
const ROLE={lead:'L',analyst:'A',designer:'D',developer:'Dv',tester:'T',verifier:'V'};
const ROLE_TR={lead:'Lead',analyst:'Analist',designer:'Tasarımcı',developer:'Developer',tester:'Tester',verifier:'Verifier'};
const draft={};
let tab=(location.hash.slice(1)||'lead'),project=null,openTask=null,chatSel=null,dtab='overview',timer=null,TASKS=[],drawerBusy=false;
try{project=localStorage.getItem('proj')}catch(e){}
if(!TABS.find(x=>x[0]===tab))tab='lead';

function h(tag,attrs,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(k==='on')for(const[ev,f]of Object.entries(v))e.addEventListener(ev,f);else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v)}
  for(const k of kids.flat(9)){if(k==null||k===false)continue;e.append(k instanceof Node?k:document.createTextNode(String(k)))}return e}
function icon(k,w){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');for(const[a,v]of Object.entries({viewBox:'0 0 24 24',fill:'none',stroke:'currentColor','stroke-width':w||1.8,'stroke-linecap':'round','stroke-linejoin':'round'}))s.setAttribute(a,v);
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',ICONS[k]||'');s.append(p);return s}
document.getElementById('logo').append(icon('logo',2.2));
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Orchestra-Token':TOKEN,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({error:'yanıt okunamadı'}));if(!r.ok)throw new Error(j.error||r.status);return j}
function toast(t,bad){const e=document.getElementById('toast');e.textContent=t;e.style.background=bad?'var(--bad)':'';e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',4500)}
const P=()=>'project='+encodeURIComponent(project);
const fmt=t=>t?new Date(t).toLocaleString('tr-TR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'-';
const ago=t=>{if(!t)return'';const s=(Date.now()-new Date(t))/1000;return s<60?'az önce':s<3600?Math.round(s/60)+' dk önce':s<86400?Math.round(s/3600)+' sa önce':Math.round(s/86400)+' gün önce'};
const dur=s=>s==null?'-':s<60?Math.round(s)+' sn':s<3600?Math.round(s/60)+' dk':(s/3600).toFixed(1)+' sa';
const num=n=>(n||0).toLocaleString('tr-TR');
const kfmt=n=>n>=1e6?(n/1e6).toFixed(1)+' M':n>=1e3?Math.round(n/1e3)+' B':String(n||0);
const CLOSED=['DONE','CLOSED','ABANDONED'];
function tone(t){const st=t.status;if(CLOSED.includes(t.stage))return t.stage==='DONE'?'c-ok':'c-mut';if(st==='RUNNING')return'c-run';
  if(['BLOCKED','STATE_ERROR'].includes(st))return'c-bad';if(['AWAITING_USER','WAITING_LIMIT','WAITING_ENV'].includes(st)||(t.gates||[]).length)return'c-warn';return'c-mut'}
const LABEL={RUNNING:'Çalışıyor',BLOCKED:'Durdu',AWAITING_USER:'Onay bekliyor',WAITING_LIMIT:'Limit bekliyor',WAITING_DEP:'Bağımlılık bekliyor',WAITING_ENV:'Ortam bekliyor',WAITING_FOR_LEAD:'Lead sırada',IDLE:'Sırada',COMPLETED:'Tamamlandı',
  DISABLED:'Otomasyon kapalı',MANUAL:'Elle',CLOSED:'Kapatıldı',ABANDONED:'Bırakıldı',STATE_ERROR:'State hatası'};
function pill(t){const q=(t.message||'').startsWith('Lead sorusu');return h('span',{class:'chip dot '+(q?'c-warn':tone(t))},q?'Yanıt bekliyor':t.stage==='DONE'?'Bitti':(LABEL[t.status]||t.status||'-'))}
function steps(path,stage){const ci=(path||[]).indexOf(stage);return h('div',{class:'steps'},(path||[]).map((s,i)=>h('span',{class:s===stage?(stage==='DONE'?'done':'cur'):i<ci?'done':''},s.replace('_',' '))))}
function progress(t){const p=t.path||[];const i=Math.max(0,p.indexOf(t.stage));return p.length>1?Math.round(100*i/(p.length-1)):0}
function avatar(role){return h('span',{class:'av '+(role||'sys')},ROLE[role]||'·')}
function needsMe(t){return !CLOSED.includes(t.stage)&&(['BLOCKED','AWAITING_USER','STATE_ERROR'].includes(t.status)||(t.gates||[]).length>0)}

/* Minimal markdown built with DOM nodes only; agent text is untrusted, never innerHTML. */
function inline(s){const out=[];const re=/(`[^`]+`|\*\*[^*]+\*\*)/g;let i=0,m;while((m=re.exec(s))){out.push(s.slice(i,m.index));
  out.push(m[0][0]==='`'?h('code',{},m[0].slice(1,-1)):h('b',{},m[0].slice(2,-2)));i=m.index+m[0].length}out.push(s.slice(i));return out}
function md(text){const box=h('div',{class:'md'});let list=null,code=null;
  for(const raw of String(text||'').split('\n')){const l=raw.replace(/\s+$/,'');
    if(l.startsWith('```')){if(code){box.append(h('pre',{},code.join('\n')));code=null}else code=[];continue}
    if(code){code.push(raw);continue}
    if(/^<!--.*-->$/.test(l.trim()))continue;
    const hm=l.match(/^#{1,4}\s+(.*)/);if(hm){list=null;box.append(h('h4',{},inline(hm[1])));continue}
    const lm=l.match(/^\s*(?:[-*]|\d+\.)\s+(\[( |x|X)\]\s+)?(.*)/);if(lm){if(!list){list=h('ul');box.append(list)}
      list.append(h('li',{class:lm[1]?'ck':''},lm[1]?(lm[2].trim()?'☑ ':'☐ '):'',inline(lm[3])));continue}
    list=null;if(l.trim())box.append(h('p',{},inline(l)))}
  if(code)box.append(h('pre',{},code.join('\n')));return box}
function sections(text){const out={};let cur='_';for(const l of String(text||'').split('\n')){const m=l.match(/^##\s+(.*)/);if(m){cur=m[1].trim();out[cur]=[];continue}(out[cur]=out[cur]||[]).push(l)}
  for(const k in out)out[k]=out[k].join('\n').trim();return out}
function leadAnalysis(text){const keep=[];for(const[k,v]of Object.entries(sections(text))){if(k==='_'||/^Kullanıcı (isteği|yanıtı)|^Lead sorusu/.test(k))continue;
  const body=v.split('\n').filter(x=>!/Lead doldurur|İsteğe bağlı: her satır|^<!--/.test(x.trim())).join('\n').trim();if(body)keep.push('#### '+k+'\n'+body)}return keep.join('\n\n')}

function dailyChart(daily){const e=Object.entries(daily||{});if(!e.length)return h('div',{class:'empty'},'Veri yok');const W=760,H=150,mx=Math.max(1,...e.map(x=>x[1].tokens)),step=(W-40)/e.length,bw=Math.max(6,Math.min(36,step-6));
  const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg'),el=(t,a)=>{const n=document.createElementNS(ns,t);for(const[k,v]of Object.entries(a))n.setAttribute(k,v);return n};
  svg.setAttribute('viewBox',`0 0 ${W} ${H+24}`);svg.style.width='100%';svg.style.height='auto';svg.style.maxHeight='220px';svg.setAttribute('role','img');svg.setAttribute('aria-label','Günlük token kullanımı');
  e.forEach(([d,v],i)=>{const x=20+i*step+(step-bw)/2,hh=Math.max(2,(H-10)*v.tokens/mx);const r=el('rect',{x,y:H-hh,width:bw,height:hh,rx:4,fill:'var(--acc)'});
    const tt=document.createElementNS(ns,'title');tt.textContent=`${d}: ${num(v.tokens)} token · ${v.runs} çalışma · $${(v.api_eq_usd||0).toFixed(2)}`;r.append(tt);svg.append(r);
    if(e.length<=14||i%Math.ceil(e.length/10)===0){const t=el('text',{x:x+bw/2,y:H+16,'text-anchor':'middle','font-size':10,fill:'var(--mut)'});t.textContent=d.slice(5);svg.append(t)}});return svg}

/* Refresh loop: keep open <details> and scroll; skip while the user is typing. */
const keyOf=d=>((d.querySelector('summary')||{}).textContent||'');
async function render(){const el=document.getElementById('view');const y=window.scrollY;
  const opened=new Map([...el.querySelectorAll('details')].map(d=>[keyOf(d),d.open]));
  try{await chrome();if(!project&&tab!=='projects')tab='projects';nav();await V[tab](el)}catch(e){el.replaceChildren(h('div',{class:'card err'},'Hata: '+e.message))}
  for(const d of el.querySelectorAll('details'))if(opened.has(keyOf(d)))d.open=opened.get(keyOf(d));
  window.scrollTo(0,y);if(openTask)renderDrawer();
  clearTimeout(timer);timer=setTimeout(tick,4000)}
function tick(){const a=document.activeElement;if(a&&['TEXTAREA','INPUT','SELECT'].includes(a.tagName)&&(a.value||a.tagName==='SELECT')){clearTimeout(timer);timer=setTimeout(tick,4000);return}render()}
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(t&&t!==tab&&V[t]){tab=t;render()}});
render();
